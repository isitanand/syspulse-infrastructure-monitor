<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server SSH Terminal</title>
    <link rel="stylesheet" href="/static/xterm/xterm.css" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #141518;
            /* Dark theme background matching UI */
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
        }

        #terminal-container {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: none;
            /* Hidden until connected */
        }

        .xterm {
            padding: 10px;
            box-sizing: border-box;
            height: 100%;
        }

        /* Loading / Login Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: #141518;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .login-box {
            background: #1f2126;
            border: 1px solid #2a2c33;
            border-radius: 14px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 8px;
        }

        .login-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 12px;
        }

        label {
            font-size: 0.85rem;
            color: #787f8d;
            font-weight: 500;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: #17181c;
            border: 1px solid #2a2c33;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
        }

        /* Override browser autofill style background and text colors */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #17181c inset !important;
            -webkit-text-fill-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        button {
            background: #22c55e;
            color: #0e1217;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
        }

        button:hover {
            background: #16a34a;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
        }

        button:disabled {
            background: #282b33;
            color: #787f8d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }

        /* Spinner */
        .spinner-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(20, 21, 24, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .status-text {
            color: #94a3b8;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <!-- Login Form Overlay -->
    <div id="login-overlay" class="overlay">
        <div class="login-box">
            <div class="login-header">
                <h2>Server SSH Terminal</h2>
            </div>

            <form id="ssh-form" autocomplete="off">
                <!-- Dummy inputs to absorb browser autofill -->
                <input type="text" name="fakeusernameremembered" style="display:none">
                <input type="password" name="fakepasswordremembered" style="display:none">

                <div class="form-row">
                    <div class="form-group">
                        <label>Host / IP</label>
                        <input type="text" id="ssh-host" placeholder="e.g. 192.168.1.100" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>Port</label>
                        <input type="number" id="ssh-port" placeholder="22" value="22" required autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="ssh-user" value="root" placeholder="root" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="ssh-pass" required autocomplete="new-password">
                </div>

                <div class="error-message" id="login-error"></div>

                <button type="submit" id="connect-btn">Connect</button>
            </form>
        </div>
    </div>

    <!-- Loading Spinner Overlay -->
    <div id="loading-spinner" class="spinner-overlay">
        <div class="spinner"></div>
        <div class="status-text" id="spinner-text">Connecting...</div>
    </div>

    <!-- Terminal Container -->
    <div id="terminal-container"></div>

    <script src="/static/xterm/xterm.js"></script>
    <script src="/static/xterm/addon-fit.js"></script>
    <script src="/static/terminal.js?v=3"></script>
</body>

</html>
